
<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Presentation Ready - Slide</title>

<body class="ready-page">

        <div class="icon">✓</div>

    <script src="/ready.js"></script>
